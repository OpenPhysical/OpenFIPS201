name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check formatting
        run: |
          java -jar tools/google-java-format-1.15.0-all-deps.jar \
            --dry-run --set-exit-if-changed \
            $(find src build/tools -name '*.java' -type f | sort)

      - name: Run unit and simulator tests
        run: tools/ant/bin/ant -f build/build.xml test-all

      - name: Enforce coverage ratchet
        run: tools/ant/bin/ant -f build/build.xml coverage

      - name: Build and verify CAP files
        env:
          SOURCE_DATE_EPOCH: "0"
          TZ: UTC
          LC_ALL: C.UTF-8
        run: tools/ant/bin/ant -f build/build.xml compile

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            build/test-reports/
            build/coverage/
            build/bin/*.cap
          if-no-files-found: ignore
